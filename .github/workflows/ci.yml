name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck install.sh bin/claude-bridge

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: the diagram matches its generator
        run: |
          node scripts/build-diagram.mjs
          git diff --exit-code docs/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claude-api-bridge:ci .
      - name: the image starts and answers the health check
        run: |
          docker run -d --name ci \
            -e BRIDGE_SECRET_KEY=ci-secret-key-long-enough-for-the-check-01 \
            -p 8787:8787 claude-api-bridge:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/health && break
            sleep 2
          done
          docker logs ci
          docker rm -f ci
