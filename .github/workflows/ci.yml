name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, so a runner image update cannot turn the build red on its own.
      - name: shellcheck
        env:
          VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz" \
            | tar -xJ
          "shellcheck-$VERSION/shellcheck" --version
          "shellcheck-$VERSION/shellcheck" install.sh bin/claude-bridge

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claude-api-bridge:ci .
      - name: the image starts and answers the health check
        run: |
          docker run -d --name ci \
            -e BRIDGE_SECRET_KEY=ci-secret-key-long-enough-for-the-check-01 \
            -p 8787:8787 claude-api-bridge:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then
              healthy=1
              break
            fi
            sleep 2
          done
          docker logs ci
          docker rm -f ci
          test -n "${healthy:-}"

  # The whole installer on a fresh machine, as root, the way a user runs it.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh runs start to finish
        run: sudo ASSUME_YES=1 PROXY_MODE=1 ./install.sh
      - name: the service answers
        run: curl -fsS http://127.0.0.1:8787/health
      - name: the command works
        run: sudo claude-bridge status
      - name: logs on failure
        if: failure()
        run: sudo docker logs claude-api-bridge --tail 50 || true
