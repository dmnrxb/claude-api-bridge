# TLS handled here. Caddy takes 80 and 443, the bridge publishes nothing.
services:
  bridge:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: claude-api-bridge-caddy
    restart: unless-stopped
    depends_on:
      - bridge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - bridge
