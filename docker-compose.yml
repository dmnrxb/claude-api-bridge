services:
  bridge:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
    image: claude-api-bridge:local
    container_name: claude-api-bridge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - bridge
    # Localhost by default. Caddy mode drops the mapping entirely.
    ports:
      - "${BRIDGE_BIND:-127.0.0.1}:${BRIDGE_PORT:-8787}:8787"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bridge:
    driver: bridge
